<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stroop Study</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; }
  #app { position: fixed; inset: 0; overflow: auto; background: #000; }
  .page { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .text { max-width: 900px; padding: 0 40px; font-size: 26px; line-height: 1.5; text-align: left; }
  .text h2 { font-size: 34px; margin: 0 0 18px; }
  .text .example { font-size: 40px; font-weight: 900; margin: 14px 0 14px 40px; }
  .next { position: fixed; left: 0; right: 0; bottom: 12vh; color: #c9a26b; font-style: italic; text-align: center; font-size: 26px; line-height: 1.5; }
  .centerText { text-align: center; font-size: 30px; }
  button { font-size: 22px; padding: 12px 32px; border-radius: 8px; border: 2px solid #888;
    background: #222; color: #fff; cursor: pointer; }
  input[type=text] { font-size: 22px; padding: 6px 10px; margin: 0 0 20px 10px; width: 160px; }

  .colours { font-size: 32px; line-height: 1.6; }
  .colours .k { display: inline-block; width: 44px; }
  .goal { font-size: 40px; text-align: center; }
  .goal .big { font-size: 64px; font-weight: 900; }

  /* Stroop */
  #score { position: fixed; top: 30px; left: 40px; font-size: calc(16.5vw * 2 / 3); font-weight: bold; color: #ff2a2a; line-height: 1; }
  #word { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 16.5vw; font-weight: 900; letter-spacing: 0.02em; }

  /* FAIL: flashes full screen, then moves under the bar */
  #failOverlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; }
  #failOverlay.on { display: flex; animation: flash 0.25s steps(1) 8; }
  @keyframes flash { 0% { background: #ff0000; } 50% { background: #000; } }
  #failBig { font-size: 22vw; font-weight: 900; color: #fff; }
  .fly { position: fixed; z-index: 11; font-weight: 900; color: #fff; white-space: nowrap; transition: all 0.7s ease-in-out; }
  #fail { position: fixed; top: 70px; left: 40px; font-size: 70px; font-weight: bold; color: #ff2222; }
  #fail span { margin-left: 16px; }
  #feelNow { position: fixed; top: 70px; left: 40px; font-size: 60px; font-weight: bold; color: #fff; }

  /* Countdown bar */
  #barTop { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #222; }
  #barTop .fill { height: 100%; }
  #barTop .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: bold; }

  /* Eval form: one centred column, every row the same width */
  .evalPage { display: flex; flex-direction: column; align-items: center; padding: 220px 0 28px; }
  .grid { display: grid; grid-template-columns: 170px 520px 170px; row-gap: 22px; align-items: center; font-size: 20px; }
  .grid .l { text-align: right; padding-right: 18px; }
  .grid .r { text-align: left; padding-left: 18px; }
  .opts { display: flex; justify-content: space-between; }
  .opts label { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 15px; color: #bbb; }
  .opts input { width: 24px; height: 24px; margin: 0; cursor: pointer; }
  .sam .opts label { width: 40px; }
  .stai .opts label { width: 110px; }
  .heads { display: flex; justify-content: space-between; }
  .heads span { width: 110px; text-align: center; font-size: 15px; color: #bbb; }
  .head { grid-column: 1 / 4; text-align: center; font-size: 22px; font-weight: bold; margin-top: 34px; }
  .submit { display: block; margin: 30px auto 0; }
  /* SAM pictures: buttons 1, 3, 5, 7, 9 sit under the centre of each picture */
  .pics { position: relative; height: 116px; margin-top: 14px; }
  .pics img { position: absolute; top: 0; width: 104px; height: 116px; }

  /* End page */
  .shape { position: relative; width: 117px; height: 92px; margin: 28px auto; }
  .shape i { position: absolute; left: 0; top: 0; width: 15px; height: 15px; background: #fff; }
  #byeBtn { visibility: hidden; margin-top: 28px; }
  /* "We also have some questions" popup */
  #popup { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; z-index: 20; }
  #popup .box { background: #222; border: 2px solid #888; border-radius: 12px; padding: 40px 60px; text-align: center; font-size: 30px; }
  #app.tvOff { animation: tvOff 0.9s ease-in forwards; }
  @keyframes tvOff {
    0%   { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
    45%  { transform: scale(1, 0.004); filter: brightness(4); background: #fff; opacity: 1; }
    75%  { transform: scale(0.003, 0.004); filter: brightness(6); background: #fff; opacity: 1; }
    100% { transform: scale(0, 0); opacity: 0; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="failOverlay"><div id="failBig">FAIL</div></div>

for (const id of SOUND_FILES.wrong) {
  const a = new Audio(MOCK_CLIPS[id]);
  a.preload = 'auto';
  audioEls[id] = a;
}
function unlockAudio() {
  for (const a of [...Object.values(audioEls), noise]) {
    a.muted = true;
    a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; });
  }
}
function playWrong() {
  if (!SOUND_FILES.wrong.length) return '';
  const id = pick(SOUND_FILES.wrong);
  for (const a of Object.values(audioEls)) a.pause();
  const el = audioEls[id];
  el.volume = 1;
  el.currentTime = 0;
  el.play().catch(() => {});
  return id;
}

function page(html) {
  clearInterval(ticker);
  for (const id of ['fail', 'feelNow', 'barTop', 'score', 'word']) $(id)?.remove();
  st.onSpace = null;
  app.innerHTML = `<div class="page">${html}</div>`;
  app.scrollTop = 0;
}

// ---- Pages ----
function setup() {
  page(`<div class="centerText">Participant ID <input type="text" id="pid"><br><button id="startBtn">Start</button></div>`);
  $('startBtn').onclick = () => { st.id = $('pid').value.trim(); unlockAudio(); welcome(); };
}

function welcome() {
  page(`<div class="text"><h2>Welcome</h2>
    This research contains three sections, each starting with a colour Stroop test.
    Please read and follow the instructions on the screen.
    <div class="next">press space to begin</div></div>`);
  st.onSpace = task;
}

function task() {
  page(`<div class="text"><h2>Stroop task</h2>
    You will see colour words printed in a <b>different ink colour</b>.
    Press the key for the <b>ink colour</b>, not the word. For example, if you see:
    <div class="example" style="color:${SETS[0].RED}">GREEN</div>
    the ink is red, so press <b>R</b>.<br>
    Answer as fast and as accurately as you can.
    <div class="next">press space to continue</div></div>`);
  st.onSpace = colours;
}

function colours() {
  const rows = Object.entries(SETS[st.section])
    .map(([c, hex]) => `<div style="color:${hex}"><span class="k">${c[0]}:</span>${c}</div>`).join('');
  page(`<div class="text"><h2>Here are the colours</h2><div class="colours">${rows}</div>
    <div class="next">press space to continue</div></div>`);
  st.onSpace = st.section === 0 ? goal : stroop;   // the goal page is shown once, in section 1
}

function goal() {
  page(`<div class="goal">Lowest score was <span class="big">25!</span><div style="font-size: 32px; margin-top: 15px">Your goal is to beat it!</div>
    <div class="next">press space to begin</div></div>`);
  st.onSpace = stroop;
}

// ---- Stroop ----
let sr = null;   // the running Stroop

function stroop() {
  page('');
  const ink = SETS[st.section];
  sr = {
    ink, names: Object.keys(ink), streak: 0, index: 0, prev: null,
    byKey: Object.fromEntries(Object.keys(ink).map((c) => [c[0].toLowerCase(), c])),
    start: performance.now(),
  };
  document.body.insertAdjacentHTML('beforeend', '<div id="score">0</div><div id="word"></div>');
  nextWord();
  ticker = setInterval(stroopTick, 20);
}

// Every word is in a different colour from its name, and no word or ink repeats back to back.
function nextWord() {
  let word, ink;
  do {
    word = pick(sr.names);
    ink = pick(sr.names.filter((c) => c !== word));
  } while (sr.prev && (word === sr.prev.word || ink === sr.prev.ink));
  sr.prev = sr.trial = { word, ink };
  sr.index += 1;
  sr.shownAt = performance.now();
  $('word').textContent = word;
  $('word').style.color = sr.ink[ink];
  $('score').textContent = sr.streak;
}

function stroopTick() {
  const now = performance.now();
  if (now - sr.start >= STROOP_MS) { clearInterval(ticker); return fail(); }
  if (now - sr.shownAt >= WORD_MS) answer(null);
}

// key is the letter pressed, or null when the word timed out.
function answer(key) {
  const t = sr.trial;
  const right = key !== null && sr.byKey[key] === t.ink;
  const p = FORCED_WRONG[sr.streak + 1] || 0;
  const forced = right && Math.random() < p;
  const correct = right && !forced;
  sr.streak = correct ? sr.streak + 1 : 0;
  if (!correct) playWrong();
  nextWord();
}

// FAIL flashes, then flies under the bar, and the timed eval appears.
function fail() {
  st.score = sr.streak;
  sr = null;
  page('');
  const ov = $('failOverlay');
  ov.classList.add('on');
  setTimeout(() => {
    const big = $('failBig');
    const from = big.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'fly';
    fly.textContent = 'FAIL';
    Object.assign(fly.style, { left: `${from.left}px`, top: `${from.top}px`, fontSize: getComputedStyle(big).fontSize });
    document.body.appendChild(fly);
    ov.classList.remove('on');

    evalForm(true);
    app.style.visibility = 'hidden';
    $('fail').style.visibility = 'hidden';
    $('barTop').style.visibility = 'hidden';
    const to = $('fail').getBoundingClientRect();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      Object.assign(fly.style, { left: `${to.left}px`, top: `${to.top}px`, fontSize: getComputedStyle($('fail')).fontSize, color: '#ff2222' });
    }));
    setTimeout(() => {
      fly.remove();
      app.style.visibility = '';
      $('fail').style.visibility = '';
      $('barTop').style.visibility = '';
      startTimer();
    }, 750);
  }, FLASH_MS);
}

// ---- Eval ----
function picsHtml(name) {
  // Button centres run from 20 px to 500 px, so pictures are centred every 120 px.
  return Array.from({ length: 5 }, (_, i) =>
    `<img src="${IMGS[name][i]}" alt="" style="left:${20 + i * 120 - 52}px">`).join('');
}

let evalStart = 0;
let evalTimed = false;

function evalForm(timed) {
  let sam = '';
  for (const it of SAM) {
    const opts = Array.from({ length: 9 }, (_, i) =>
      `<label><input type="radio" name="${it.id}" value="${i + 1}" required>${i + 1}</label>`).join('');
    sam += `<div></div><div class="pics">${picsHtml(it.img)}</div><div></div>`;
    sam += `<div class="l">${it.left}</div><div class="opts">${opts}</div><div class="r">${it.right}</div>`;
  }
  let stai = `<div class="head">Right now, I feel…</div>
    <div></div><div class="heads">${STAI_LABELS.map((l) => `<span>${l}</span>`).join('')}</div><div></div>`;
  for (const w of STAI) {
    const opts = STAI_LABELS.map((l, i) => `<label><input type="radio" name="stai_${w}" value="${i + 1}" required></label>`).join('');
    stai += `<div class="l">I feel ${w}</div><div class="opts">${opts}</div><div></div>`;
  }
  page('');
  app.innerHTML = `<div class="evalPage"><form id="form">
    <div class="grid sam">${sam}</div><div class="grid stai">${stai}</div>
    <button type="submit" class="submit">Submit</button></form></div>`;
  if (timed) {
    document.body.insertAdjacentHTML('beforeend',
      `<div id="fail">FAIL<span>${st.score}</span></div>` +
      `<div id="barTop"><div class="fill" id="barFill"></div><div class="num" id="barNum">${EVAL_S}</div></div>`);
  } else {
    document.body.insertAdjacentHTML('beforeend', '<div id="feelNow">How do you feel now?</div>');
  }
  // The questions start below the FAIL / "How do you feel now?" line, however tall it wraps.
  const header = $(timed ? 'fail' : 'feelNow');
  app.querySelector('.evalPage').style.paddingTop = `${Math.round(header.getBoundingClientRect().bottom + 40)}px`;
  // MOCK: every answer prefilled
  for (const it of SAM) $('form').querySelector(`input[name="${it.id}"][value="5"]`).checked = true;
  for (const w of STAI) $('form').querySelector(`input[name="stai_${w}"][value="2"]`).checked = true;
  evalTimed = timed;
  evalStart = performance.now();
  $('form').addEventListener('submit', submitEval);
}

function startTimer() {
  evalStart = performance.now();
  const tick = () => {
    const left = Math.max(0, EVAL_S - (performance.now() - evalStart) / 1000);
    $('barFill').style.width = `${(left / EVAL_S) * 100}%`;
    $('barFill').style.background = left > 15 ? '#22dd22' : left > 10 ? '#ffcc00' : left > 5 ? '#ff8c00' : '#ff2222';
    $('barNum').textContent = Math.ceil(left);
  };
  tick();
  ticker = setInterval(tick, 50);
}

// Local clock time, e.g. 2026-11-18 14:32:05
function clockTime() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function submitEval(e) {
  e.preventDefault();
  const value = (name) => $('form').querySelector(`input[name="${name}"]:checked`)?.value || '';
  const row = {
    participant_id: st.id, timestamp: clockTime(), section: st.section + 1, eval: evalTimed ? 'after_stroop' : 'after_instructions',
    stroop_score: st.score,
  };
  for (const it of SAM) row[it.id] = value(it.id);
  for (const w of STAI) row[`stai_${w}`] = value(`stai_${w}`);
  st.rows.push(row);

  if (evalTimed) return instructions();
  if (st.section === 1) return questionsPopup(afterEval);   // section 2 only
  afterEval();
}

// "We also have some questions": the dots appear one at a time, the popup
// stays until 10 s in total, then the next page shows.
const DOT_MS = 500;
const POPUP_MS = 2000;   // MOCK: 2 s instead of 10 s
function questionsPopup(then) {
  document.body.insertAdjacentHTML('beforeend',
    '<div id="popup"><div class="box">We also have some questions<span id="dots" style="display:inline-block;width:1.2em;text-align:left"></span></div></div>');
  for (let i = 1; i <= 3; i++) setTimeout(() => { $('dots').textContent = '.'.repeat(i); }, i * DOT_MS);
  setTimeout(() => { $('popup').remove(); then(); }, POPUP_MS);
}

function afterEval() {
  if (st.section === SETS.length - 1) {   // the 6th eval's Submit saves the data
    download();
    return end();
  }
  ready();
}

function ready() {
  page(`<div class="centerText">Ready for the next test?
    <div class="next">press space to continue</div></div>`);
  st.onSpace = () => { st.section += 1; colours(); };   // the task page is shown once, in section 1
}

noise.preload = 'auto';
noise.loop = true;   // only matters if a robots page ever lasts longer than the file
function startNoise() { noise.currentTime = 0; noise.play().catch(() => {}); }
function stopNoise() { noise.pause(); }

function instructions() {
  page(`<div class="centerText">${INSTRUCTIONS[st.section]}<br><br><button id="nextBtn">Next</button></div>`);
  $('nextBtn').onclick = () => { stopNoise(); evalForm(false); };
  if (st.section > 0) startNoise();
  if (st.section > 0) {   // robot sections: Next appears once the robots have had their time
    $('nextBtn').style.visibility = 'hidden';
    const btn = $('nextBtn');
    setTimeout(() => { btn.style.visibility = 'visible'; }, ROBOT_MS);
  }
}

// One CSV per participant: a row per eval, with that section's final Stroop score.
function download() {
  const cols = [];
  for (const r of st.rows) for (const c of Object.keys(r)) if (!cols.includes(c)) cols.push(c);
  const csv = [cols.join(','), ...st.rows.map((r) => cols.map((c) => r[c] ?? '').join(','))].join('\n') + '\n';
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${st.id || 'noid'}_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---- End page: fireworks into a heart, then a smile ----
const STEP = 17;   // 15 px squares, 2 px apart
const HEART = [[1, 0], [3, 0], [0, 1], [2, 1], [4, 1], [1, 2], [3, 2], [2, 3]].map(([x, y]) => [x * 1.5, y * 1.5]);
// SMILE[i] is where heart square i goes: 2-square eyes and an evenly spaced mouth.
const SMILE = [[1, 0], [4, 0], [1, 1], [10 / 3, 4], [4, 1], [0, 3], [5, 3], [5 / 3, 4]].map(([x, y]) => [x + 0.5, y + 0.25]);
const FIREWORKS_MS = 2600;
const BEAT_MS = 1600;   // the heart beats twice (bigger, smaller) in this time, then turns into the smile
const MORPH_MS = 800;

function end() {
  page(`<div class="centerText">
    <div>Thank you for the support.</div>
    <div style="margin-top: 5px">Hope you liked it!</div>
    <div class="shape" id="shape"></div>
    <div>- toio robots</div>
    <button id="byeBtn">Bye Bye!</button></div>`);
  $('byeBtn').onclick = () => app.classList.add('tvOff');
  fireworks();
}

function fireworks() {
  const box = $('shape');
  box.innerHTML = HEART.map(() => '<i></i>').join('');
  const cx = 51, cy = 38.5;
  const squares = [...box.children];
  squares.forEach((sq, i) => {
    const [x, y] = HEART[i];
    const angle = (i / squares.length) * 2 * Math.PI + Math.random() * 0.5;
    const dist = 110 + Math.random() * 50;
    const bx = cx + Math.cos(angle) * dist, by = cy - 90 + Math.sin(angle) * dist;
    const spin = (Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 360);
    sq.animate([
      { transform: `translate(${cx}px, ${cy + 220}px) scale(0.6)`, offset: 0 },
      { transform: `translate(${cx}px, ${cy - 90}px) scale(0.6)`, offset: 0.3, easing: 'ease-out' },
      { transform: `translate(${bx}px, ${by}px) rotate(${spin}deg) scale(1)`, opacity: 0.5, offset: 0.55 },
      { transform: `translate(${bx}px, ${by + 20}px) rotate(${spin}deg) scale(1)`, opacity: 1, offset: 0.65, easing: 'ease-in-out' },
      { transform: `translate(${x * STEP}px, ${y * STEP}px) rotate(0deg) scale(1)`, offset: 1 },
    ], { duration: FIREWORKS_MS, fill: 'forwards', easing: 'ease-in-out' });
  });
  setTimeout(() => {
    box.animate([
      { transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' },
      { transform: 'scale(1.25)' }, { transform: 'scale(1)' },
    ], { duration: BEAT_MS, easing: 'ease-in-out' });
  }, FIREWORKS_MS);
  setTimeout(() => {
    squares.forEach((sq, i) => sq.animate([
      { transform: `translate(${HEART[i][0] * STEP}px, ${HEART[i][1] * STEP}px)` },
      { transform: `translate(${SMILE[i][0] * STEP}px, ${SMILE[i][1] * STEP}px)` },
    ], { duration: MORPH_MS, fill: 'forwards', easing: 'ease-in-out' }));
  }, FIREWORKS_MS + BEAT_MS);
  setTimeout(() => { $('byeBtn').style.visibility = 'visible'; }, FIREWORKS_MS + BEAT_MS + MORPH_MS);
}

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (sr) {
    const key = e.key.toLowerCase();
    if (sr.byKey[key]) answer(key);
    return;
  }
  if (e.key === ' ' && st.onSpace) { e.preventDefault(); st.onSpace(); }
});

setup();
</script>
