<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stroop Task</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: Arial, Helvetica, sans-serif; user-select: none; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  /* Setup and end screens */
  h1 { font-size: 48px; margin: 0 0 24px; }
  .field { font-size: 22px; margin: 8px 0; }
  .field input { font-size: 22px; width: 80px; margin-left: 10px; padding: 4px; text-align: center; }
  button { font-size: 22px; padding: 12px 28px; margin: 8px; border-radius: 8px; border: 2px solid #888;
    background: #222; color: #fff; cursor: pointer; }
  .scores { font-size: 32px; margin-bottom: 24px; line-height: 1.6; }
  .scores b { color: #ff2a2a; }
  .modes { margin-bottom: 16px; }
  .modes button.on { background: #fff; color: #000; border-color: #fff; }
  #doneTitle.fail, #doneTitle.success { font-size: 16vw; font-weight: 900; margin-bottom: 2vh; }
  #doneTitle.fail { color: #ff2222; }
  #doneTitle.success { color: #22dd22; }

  /* Intro screens */
  #intro { cursor: none; }
  .intro { max-width: 900px; padding: 0 40px; text-align: left; font-size: 26px; line-height: 1.5; }
  .intro h2 { font-size: 34px; margin: 0 0 18px; }
  .intro .example { font-size: 40px; font-weight: 900; margin: 14px 0 14px 40px; }
  .intro .next { color: #c9a26b; font-style: italic; text-align: center; margin-top: 28px; }
  .rows { display: grid; grid-template-columns: auto auto auto; justify-content: center; column-gap: 20px; row-gap: 6px; align-items: baseline; font-size: 32px; }
  .rows .w { font-weight: bold; text-align: right; }
  .rows .k { color: #fff; font-weight: bold; }
  .rows span { color: #aaa; }

  /* Task screen */
  #task { cursor: none; }
  #countdown[hidden] { display: none; }
  #countdown { position: fixed; top: 2vh; right: 3vw; font-size: 22vh; font-weight: bold; line-height: 1; }
  #score { position: fixed; top: 3vh; left: 3vw; font-size: 10vh; font-weight: bold; color: #ff2a2a; line-height: 1; }
  #word { font-size: 22vw; font-weight: 900; letter-spacing: 0.02em; }
  #word.feedback { font-size: 16vw; }

  #pausedNote { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center;
    justify-content: center; flex-direction: column; font-size: 6vh; z-index: 5; }
  #pausedNote.on { display: flex; }
  #pausedNote small { font-size: 2.6vh; color: #aaa; margin-top: 2vh; }
</style>
</head>
<body>

<div id="setup" class="screen on">
  <div class="center">
    <h1>Stroop Task</h1>
    <div class="modes">
      <button id="modeFixed" data-mode="fixed">Fixed trials</button>
      <button id="modeChallenge" data-mode="challenge">Streak challenge</button>
      <button id="modeHard" data-mode="hard">Hard challenge</button>
    </div>
    <div class="field" data-for="fixed">Trials <input id="trialsIn" type="number" min="1" max="50" value="50"></div>
    <div class="field" data-for="fixed">Countdown seconds <input id="secondsIn" type="number" min="1" max="30" value="3"></div>
    <button id="startBtn">Begin (Space)</button>
  </div>
</div>

<div id="intro" class="screen"><div class="center"><div class="intro" id="introBody"></div></div></div>

<div id="task" class="screen">
  <div id="countdown"></div>
  <div id="score"></div>
  <div class="center"><div id="word"></div></div>
  <div id="pausedNote">Paused<small>Esc to resume · Q to quit to setup</small></div>
</div>

<div id="done" class="screen">
  <div class="center">
    <h1 id="doneTitle">Finished</h1>
    <div class="scores" id="finalScores"></div>
    <div>
      <button id="exportBtn">Export CSV</button>
      <button id="againBtn">New session</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// Ink colours, tuned to be readable on a black background. Each colour's key is
// its first letter, so the first letters within a set must all differ.
const STANDARD = {
  RED: '#ff1a1a',
  BLUE: '#2f6bff',
  GREEN: '#1fbf1f',
  YELLOW: '#ffe100',
  PURPLE: '#9b40ff',
  ORANGE: '#ff8c00',
  WHITE: '#ffffff',
  CYAN: '#00e5ff',
};
// The hard challenge uses one of these per session, taking the next set each
// session. Each set has at least two colours of the same shade
// (red/pink; green/lime and brown/orange; purple/violet).
const HARD_SETS = [
  { RED: '#ff1a1a', PINK: '#ff7ab8', BLUE: '#2f6bff', YELLOW: '#ffe100', WHITE: '#ffffff', CYAN: '#00e5ff' },
  { BROWN: '#a0522d', ORANGE: '#ff8c00', GREEN: '#1fbf1f', LIME: '#9dff00', CYAN: '#00e5ff', MAGENTA: '#ff00ff' },
  { ROSE: '#ff4d7a', PURPLE: '#9b40ff', VIOLET: '#c77dff', MINT: '#7dffb0', GREY: '#8a8a8a', NAVY: '#2b3fae' },
];

// Three modes: 'fixed' runs a set number of trials; 'challenge' keeps going
// until the streak reaches the target, and fails if the time limit runs out
// first; 'hard' is the challenge with rotating colour sets, and the answer
// after a streak of RIG_AT is always marked wrong, even when it is right.
const MAX_TRIALS = 50;
const CHALLENGE = { target: 25, minutes: 3, seconds: 1 };
const RIG_AT = 16;
let mode = 'fixed';
const isChallenge = (m) => m === 'challenge' || m === 'hard';
const FEEDBACK_MS = 1000;
// The countdown still runs and times trials out; this only controls whether it is shown.
const SHOW_TIMER = false;

// SOUND_FILES:BEGIN (written by `npm run trim` from the files in audio/)
const SOUND_FILES = {
  wrong: ["w_boo","w_buzzer","w_mocking"],
};
// SOUND_FILES:END

// ---- Audio ----
// Correct answers are silent. Wrong answers play one of the w_ clips, picked
// evenly at random, at full volume.
const audioEls = {};
for (const id of SOUND_FILES.wrong) {
  const a = new Audio(`audio/${id}.mp3`);
  a.preload = 'auto';
  audioEls[id] = a;
}

// Called from the Begin key/click so the browser allows audio later.
function unlockAudio() {
  for (const a of Object.values(audioEls)) {
    a.muted = true;
    a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; });
  }
}

// Long clips (boo, mocking laugh) carry on into the next trial; a new wrong
// answer cuts off whatever is still playing.
function playSound(id) {
  const el = audioEls[id];
  if (!el) return;
  for (const other of Object.values(audioEls)) if (other !== el) other.pause();
  el.volume = 1;
  el.currentTime = 0;
  el.play().catch(() => {});
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function wrongSound() {
  return SOUND_FILES.wrong.length ? pick(SOUND_FILES.wrong) : '';
}

// ---- Trials ----
// Every trial is incongruent, and no word or ink repeats back to back.
function makeTrial(prev) {
  const colours = Object.keys(s.ink);
  let word, ink;
  do {
    word = pick(colours);
    ink = pick(colours.filter((c) => c !== word));
  } while (prev && (word === prev.word || ink === prev.ink));
  return { word, ink };
}

function makeTrials(n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(makeTrial(out[out.length - 1]));
  return out;
}

// ---- Intro screens ----
function introPages() {
  const first = `<h2>Stroop task</h2>
       You will see colour words printed in a <b>different ink colour</b>.
       Press the key for the <b>ink colour</b>, not the word. For example, if you see:
       <div class="example" style="color:${STANDARD.RED}">GREEN</div>
       the ink is red, so press <b>R</b>.<br>
       You have ${s.seconds} ${s.seconds === 1 ? 'second' : 'seconds'} for each word. Answer as fast and as accurately as you can.`;

  const second = `<h2>The keys</h2>${keyRows()}`;

  if (!isChallenge(s.mode)) {
    return [
      first + '<div class="next">press space for the keys…</div>',
      second + '<div class="next">press space to start…</div>',
    ];
  }

  // Challenges get a third screen with what it takes to pass.
  const third = `<h2>To pass the test</h2>
       You need a score of <b>${s.target}</b>.`;
  return [
    first + '<div class="next">press space for the keys…</div>',
    second + '<div class="next">press space to continue…</div>',
    third + '<div class="next">press space to start…</div>',
  ];
}

// Each colour of the current set with its key.
function keyRows() {
  const rows = Object.entries(s.ink).map(([c, hex]) =>
    `<div class="w" style="color:${hex}">${c.toLowerCase()}</div><span>=</span><div class="k">${c[0]}</div>`).join('');
  return `<div class="rows">${rows}</div>`;
}

// Hard challenge: the colour set for the next session (1, 2, 3, 1, ...).
let hardSet = 0;
try { hardSet = (parseInt(localStorage.getItem('stroopHardSet'), 10) || 0) % HARD_SETS.length; } catch (e) {}

function useSet(i) {
  s.setIndex = i;
  s.ink = s.mode === 'hard' ? HARD_SETS[i] : STANDARD;
  s.byKey = Object.fromEntries(Object.keys(s.ink).map((c) => [c[0].toLowerCase(), c]));
}

// ---- Task state ----
let s = null;
let ticker = null;

function show(id) {
  for (const el of document.querySelectorAll('.screen')) el.classList.toggle('on', el.id === id);
}

// Active time on the current trial, excluding pauses.
function elapsed() {
  return s.activeMs + (s.paused ? 0 : performance.now() - s.clockStart);
}

// Time since the trials started, excluding pauses. Used for the challenge time limit.
function sessionElapsed() {
  return s.sessionMs + (s.paused ? 0 : performance.now() - s.sessionStart);
}

function formatMinutes(ms) {
  const total = Math.round(ms / 1000);
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
}

function setMode(m) {
  mode = m;
  for (const b of document.querySelectorAll('.modes button')) b.classList.toggle('on', b.dataset.mode === m);
  for (const f of document.querySelectorAll('[data-for]')) f.hidden = !f.dataset.for.split(' ').includes(m);
}

function begin() {
  const trials = Math.max(1, Math.min(MAX_TRIALS, parseInt($('trialsIn').value, 10) || MAX_TRIALS));
  const fixedSeconds = Math.max(1, Math.min(30, parseInt($('secondsIn').value, 10) || 3));
  try { localStorage.setItem('stroopSettings', JSON.stringify({ mode, trials, seconds: fixedSeconds })); } catch (e) {}
  unlockAudio();
  const seconds = isChallenge(mode) ? CHALLENGE.seconds : fixedSeconds;
  s = { mode, count: trials, seconds, target: CHALLENGE.target, limitMs: CHALLENGE.minutes * 60000, log: [], paused: false };
  useSet(mode === 'hard' ? hardSet : 0);
  if (mode === 'hard') {
    hardSet = (hardSet + 1) % HARD_SETS.length;
    try { localStorage.setItem('stroopHardSet', hardSet); } catch (e) {}
  }
  startIntro();
}

function startIntro() {
  s.phase = 'intro';
  s.pages = introPages();
  s.page = 0;
  $('introBody').innerHTML = s.pages[0];
  show('intro');
}

function nextIntroPage() {
  s.page += 1;
  if (s.page < s.pages.length) {
    $('introBody').innerHTML = s.pages[s.page];
    return;
  }
  // Start the trials.
  s.trials = s.mode === 'fixed' ? makeTrials(s.count) : [];
  s.index = -1;
  s.sessionMs = 0;
  s.sessionStart = performance.now();
  // The score on screen is a streak: +1 per correct answer, back to 0 on a wrong one.
  s.streak = 0;
  s.best = 0;
  show('task');
  nextTrial();
  clearInterval(ticker);
  ticker = setInterval(tick, 20);
}

function nextTrial() {
  s.index += 1;
  if (isChallenge(s.mode)) s.trials.push(makeTrial(s.trials[s.index - 1]));
  if (s.index >= s.trials.length) return finish();
  s.phase = 'running';
  s.activeMs = 0;
  s.clockStart = performance.now();
  const t = s.trials[s.index];
  const word = $('word');
  word.className = '';
  word.style.color = s.ink[t.ink];
  word.textContent = t.word;
  renderClock();
}


function remaining() {
  return Math.max(0, s.seconds - Math.floor(elapsed() / 1000));
}

function renderClock() {
  const left = remaining();
  const cd = $('countdown');
  cd.textContent = left;
  cd.style.color = `hsl(${Math.round(120 * (left / s.seconds))}, 100%, 50%)`;
  $('score').textContent = scoreText();
}

// Streak over the goal: the number of trials, or the target streak in a challenge.
function scoreText() {
  return `${s.streak} / ${isChallenge(s.mode) ? s.target : s.trials.length}`;
}

function tick() {
  if (!s || s.paused) return;
  if (isChallenge(s.mode) && (s.phase === 'running' || s.phase === 'feedback') && sessionElapsed() >= s.limitMs) {
    finish('fail');
    return;
  }
  if (s.phase !== 'running') return;
  if (elapsed() >= s.seconds * 1000) {
    resolve(null);
    return;
  }
  renderClock();
}

// Scores the current trial once. key is the letter pressed, or null on timeout.
function resolve(key) {
  if (s.phase !== 'running' || s.paused) return;
  s.phase = 'feedback';
  const t = s.trials[s.index];
  const rt = Math.round(elapsed());
  const right = key !== null && s.byKey[key] === t.ink;
  // Hard challenge: the answer after a streak of RIG_AT is marked wrong anyway.
  const rigged = s.mode === 'hard' && right && s.streak === RIG_AT;
  const isCorrect = right && !rigged;
  const sound = isCorrect ? '' : wrongSound();
  s.streak = isCorrect ? s.streak + 1 : 0;
  s.best = Math.max(s.best, s.streak);
  s.log.push({
    trial: s.index + 1,
    word: t.word,
    ink: t.ink,
    colour_set: s.mode === 'hard' ? s.setIndex + 1 : '',
    answer_key: t.ink[0],
    key: key ? key.toUpperCase() : '',
    response: key ? s.byKey[key] : '',
    result: isCorrect ? 'correct' : 'wrong',
    rigged: rigged ? 'yes' : '',
    source: key ? 'response' : 'timeout',
    sound,
    rt_ms: key ? rt : '',
    streak: s.streak,
    session_ms: Math.round(sessionElapsed()),
  });
  if (isChallenge(s.mode) && s.streak >= s.target) {
    finish('success');
    return;
  }

  if (key === null) $('countdown').textContent = 0;
  $('score').textContent = scoreText();
  const word = $('word');
  word.className = 'feedback';
  word.style.color = isCorrect ? '#22dd22' : '#ff2222';
  word.textContent = isCorrect ? 'CORRECT' : 'WRONG';
  if (sound) playSound(sound);
  s.feedbackLeft = FEEDBACK_MS;
  s.feedbackStart = performance.now();
  s.feedbackTimer = setTimeout(nextTrial, FEEDBACK_MS);
}

// outcome is 'success' or 'fail' in a challenge; nothing in fixed mode.
function finish(outcome) {
  clearInterval(ticker);
  clearTimeout(s.feedbackTimer);
  s.phase = 'done';
  s.outcome = outcome || '';
  const title = $('doneTitle');
  title.className = s.outcome;
  if (isChallenge(s.mode)) {
    title.textContent = outcome === 'success' ? 'SUCCESS' : 'FAIL';
    $('finalScores').innerHTML = outcome === 'success'
      ? `${s.target} in a row in <b>${formatMinutes(sessionElapsed())}</b>`
      : `Best streak: <b>${s.best} / ${s.target}</b>`;
  } else {
    title.textContent = 'Finished';
    $('finalScores').innerHTML = `Best streak: <b>${s.best} / ${s.trials.length}</b>`;
  }
  show('done');
}

function togglePause() {
  if (!s.paused) {
    s.activeMs = elapsed();
    s.sessionMs = sessionElapsed();
    s.paused = true;
    if (s.phase === 'feedback') {
      clearTimeout(s.feedbackTimer);
      s.feedbackLeft -= performance.now() - s.feedbackStart;
    }
  } else {
    s.paused = false;
    s.clockStart = performance.now();
    s.sessionStart = performance.now();
    if (s.phase === 'feedback') {
      s.feedbackStart = performance.now();
      s.feedbackTimer = setTimeout(nextTrial, Math.max(0, s.feedbackLeft));
    }
  }
  $('pausedNote').classList.toggle('on', s.paused);
}

function quitToSetup() {
  clearInterval(ticker);
  clearTimeout(s.feedbackTimer);
  s = null;
  setMode(mode);
  $('pausedNote').classList.remove('on');
  show('setup');
}

function exportCsv() {
  const cols = ['trial', 'colour_set', 'word', 'ink', 'answer_key', 'key', 'response', 'result', 'rigged', 'source', 'sound',
    'rt_ms', 'streak', 'session_ms'];
  const header = ['trial', 'colour_set', 'word', 'ink_colour', 'correct_key', 'key_pressed', 'response_colour',
    'correct_wrong', 'marked_wrong_on_purpose', 'response_timeout', 'sound', 'response_time_ms', 'streak', 'time_since_start_ms'];
  const lines = [header.join(','), ...s.log.map((r) => cols.map((c) => r[c]).join(','))];
  const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const tag = isChallenge(s.mode) ? `${s.mode}-${s.outcome}-` : '';
  a.download = `stroop-${tag}${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('countdown').hidden = !SHOW_TIMER;

// ---- Input ----
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const key = e.key.toLowerCase();
  if (!s) {
    if (key === ' ' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); begin(); }
    return;
  }
  if (s.phase === 'done') return;
  if (s.phase === 'intro') {
    if (key === ' ') { e.preventDefault(); nextIntroPage(); }
    return;
  }
  if (key === 'escape') return togglePause();
  if (s.paused) {
    if (key === 'q') quitToSetup();
    return;
  }
  if (s.byKey[key]) resolve(key);
});

for (const b of document.querySelectorAll('.modes button')) b.onclick = () => { setMode(b.dataset.mode); b.blur(); };  // blur so Space still begins
$('startBtn').onclick = begin;
$('exportBtn').onclick = exportCsv;
$('againBtn').onclick = () => { s = null; setMode(mode); show('setup'); };

try {
  const saved = JSON.parse(localStorage.getItem('stroopSettings'));
  if (saved) {
    $('trialsIn').value = saved.trials;
    $('secondsIn').value = saved.seconds;
    if (saved.mode) mode = saved.mode;
  }
} catch (e) {}
setMode(mode);
</script>
</body>
</html>
