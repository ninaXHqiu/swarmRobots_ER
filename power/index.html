<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot power</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --card:#fff; --line:#d9d9d4; --muted:#6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --card:#20201f; --line:#383836; --muted:#9a9a94; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; padding:16px; }
  main { max-width:520px; margin:0 auto; }
  button#connect { font:inherit; padding:10px 18px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; cursor:pointer; }
  ul { list-style:none; margin:16px 0 0; padding:0; }
  li { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .swatch { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); padding:0; cursor:pointer; flex:none; }
  .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .power { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  li.gone .power { color:var(--muted); font-size:15px; font-weight:400; }
</style>
</head>
<body>
<main>
  <button id="connect">Connect</button>
  <ul id="list"></ul>
</main>
<script src="power.js"></script>
<script>
(function () {
  var robots = [], list = document.getElementById('list'), rows = new Map();
  function render(r) {
    var li = rows.get(r);
    if (!li) {
      li = document.createElement('li');
      var sw = document.createElement('button'); sw.className = 'swatch'; sw.setAttribute('aria-label', 'Flash purple');
      sw.onclick = function () { r.flash(); };
      var nm = document.createElement('span'); nm.className = 'name';
      var pw = document.createElement('span'); pw.className = 'power';
      li.appendChild(sw); li.appendChild(nm); li.appendChild(pw); list.appendChild(li); rows.set(r, li);
    }
    li.className = r.connected ? '' : 'gone';
    li.querySelector('.name').textContent = r.name;
    li.querySelector('.power').textContent = !r.connected ? 'not connected' : r.power === null ? '...' : r.power + '%';
    var c = r.currentColor();
    li.querySelector('.swatch').style.background = c && r.connected ? RobotPower.cssColor(c) : 'transparent';
  }
  document.getElementById('connect').onclick = function () {
    if (!navigator.bluetooth) { alert('Use Chrome or Edge on a computer.'); return; }
    RobotPower.addRobot(navigator.bluetooth, robots, render).catch(function (e) { if (e && e.name !== 'NotFoundError') { alert(e.message || e); } });
  };
})();
</script>
</body>
</html>
