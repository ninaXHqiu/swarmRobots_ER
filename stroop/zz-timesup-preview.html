<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time's up preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; font-family: Arial, Helvetica, sans-serif; }
  #ov { position: fixed; inset: 0; background: #ff0000; display: flex; align-items: center; justify-content: center; }
  #txt { font-size: 16vw; font-weight: 900; color: #fff; white-space: nowrap; }
  #face { position: relative; display: none; }
  #face i { position: absolute; width: 4vw; height: 4vw; background: #fff; }
</style>
</head>
<body>
<div id="ov"><div id="txt"></div><div id="face"></div></div>
<script>
// PREVIEW: OOPS -> TIME'S UP -> face, on red, no flash. Loops with a short black gap.
const STEP_MS = 800;
// The swarm smile from the end-page mocks: one square per eye, 6 for the mouth.
const EYES = [[1, 0], [4, 0]];
const MOUTH = [[0, 2], [5, 2], [1, 3], [2, 3], [3, 3], [4, 3]];
const U = 4.6;   // vw per grid step (4 vw squares, small gap)
const face = document.getElementById('face');
face.style.width = `${5 * U + 4}vw`;
face.style.height = `${3 * U + 4}vw`;
face.innerHTML = [...EYES, ...MOUTH].map(([x, y]) => `<i style="left:${x * U}vw;top:${y * U}vw"></i>`).join('');

const ov = document.getElementById('ov'), txt = document.getElementById('txt');
function show(i) {
  ov.style.visibility = i === 3 ? 'hidden' : 'visible';
  txt.style.display = i < 2 ? '' : 'none';
  face.style.display = i === 2 ? 'block' : 'none';
  if (i === 0) txt.textContent = 'OOPS';
  if (i === 1) txt.textContent = "TIME'S UP";
  setTimeout(() => show((i + 1) % 4), i === 3 ? 1000 : STEP_MS);
}
show(0);
</script>
</body>
</html>
