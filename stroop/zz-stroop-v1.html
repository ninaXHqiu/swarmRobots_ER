const $ = (id) => document.getElementById(id);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const audioEls = Object.fromEntries(Object.keys(MOCK_CLIPS).map((id) => [id, new Audio(MOCK_CLIPS[id])]));
let unlocked = false;
function unlockAudio() {
  if (unlocked) return; unlocked = true;
  for (const a of Object.values(audioEls)) {
    a.muted = true;
    a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; });
  }
}
function playWrong() {
  for (const a of Object.values(audioEls)) a.pause();
  const el = audioEls[pick(Object.keys(audioEls))];
  el.currentTime = 0;
  el.play().catch(() => {});
}
function wordMs() {
  let r = Math.random();
  for (const [ms, p] of DURATIONS) { if ((r -= p) < 0) return ms; }
  return DURATIONS[DURATIONS.length - 1][0];
}

let round = 0, sr = null, ticker = null, onSpace = null;

function startPage() {
  $('app').innerHTML = '<div class="next">press space to begin</div>';
  onSpace = stroop;
}

function stroop() {
  onSpace = null;
  $('app').innerHTML = '';
  const ink = SETS[round];
  sr = { ink, names: Object.keys(ink), streak: 0, prev: null,
    byKey: Object.fromEntries(Object.keys(ink).map((c) => [c[0].toLowerCase(), c])),
    start: performance.now() };
  document.body.insertAdjacentHTML('beforeend', '<div id="score">0</div><div id="word"></div>');
  nextWord();
  ticker = setInterval(tick, 20);
}

function nextWord() {
  let word, ink;
  do {
    word = pick(sr.names);
    ink = pick(sr.names.filter((c) => c !== word));
  } while (sr.prev && (word === sr.prev.word || ink === sr.prev.ink));
  // Decide now whether a correct answer to this word will be marked wrong.
  const forced = Math.random() < (FORCED_WRONG[sr.streak + 1] || 0);
  sr.prev = sr.trial = { word, ink, forced, ms: forced ? FORCED_MS : wordMs() };
  sr.shownAt = performance.now();
  $('word').textContent = word;
  $('word').style.color = sr.ink[ink];
  $('score').textContent = sr.streak;
}

function tick() {
  const now = performance.now();
  if (now - sr.start >= ROUND_MS) return endRound();
  if (now - sr.shownAt >= sr.trial.ms) answer(null);
}

function answer(key) {
  const t = sr.trial;
  const correct = key !== null && sr.byKey[key] === t.ink && !t.forced;
  sr.streak = correct ? sr.streak + 1 : 0;
  if (!correct) playWrong();
  nextWord();
}

function endRound() {
  clearInterval(ticker);
  sr = null;
  $('score').remove(); $('word').remove();
  round += 1;
  if (round < ROUNDS) startPage();
  else $('app').innerHTML = '';
}

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  unlockAudio();
  if (sr) {
    const key = e.key.toLowerCase();
    if (sr.byKey[key]) answer(key);
    return;
  }
  if (e.key === ' ' && onSpace) { e.preventDefault(); onSpace(); }
});

startPage();
</script>
