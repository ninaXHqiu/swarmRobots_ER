# Builds the routine simulator in GitHub (no local Unity needed) and publishes it to GitHub Pages.
# Does the same as tools/publish-pages.sh: WebBuild.BuildSimulator -> SimPreview/ (+ stroop/ at /stroop/)
# -> the gh-pages branch, replaced each time so it never grows.
#
# Runs by itself when a change in Assets/ reaches main, or by hand: Actions > Publish simulator > Run workflow.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of the Unity_lic.ulf file of an activated Unity Personal licence
#   UNITY_EMAIL     the Unity account email
#   UNITY_PASSWORD  the Unity account password
name: Publish simulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Assets/**", "Packages/**", "ProjectSettings/**", "stroop/**"]

permissions:
  contents: write

concurrency:
  group: publish-simulator
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (the Unity WebGL image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build the simulator (WebGL)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto            # read from ProjectSettings/ProjectVersion.txt (2021.3.26f1)
          targetPlatform: WebGL
          buildMethod: WebBuild.BuildSimulator   # writes SimPreview/

      - name: Put the site together
        run: |
          test -f SimPreview/index.html || { echo "The build made no SimPreview/index.html"; exit 1; }
          mkdir site
          cp -R SimPreview/. site/
          if [ -d stroop/public ]; then
            mkdir -p site/stroop
            rsync -a --exclude originals stroop/public/ site/stroop/
          fi

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true            # replace the branch, as tools/publish-pages.sh does
          full_commit_message: Simulator build from ${{ github.sha }} (GitHub Actions)
